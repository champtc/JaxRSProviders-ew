# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: JaxRSProviders Build for DarkLight

on:
  push:
    branches: [ darklight ]
  pull_request:
    branches: [ darklight ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: GitHub Tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN  }}

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
		distribution: 'temurin'
		java-version: |
		  11
		  21
        cache: maven

    - name: maven-settings-xml-action
      uses: whelk-io/maven-settings-xml-action@v22
      with:
        repositories: '[{ "id": "central", "url": "https://repo1.maven.org/maven2" }, { "id": "JaxRSProviders-ew", "url": "https://maven.pkg.github.com/champtc/JaxRSProviders-ew" }]'
        servers: '[{ "id": "JaxRSProviders-ew", "username": "champtc", "password": "${{ secrets.GITHUB_TOKEN }}" }]'

    - name: Build with Maven
      run: mvn -B deploy -f ./pom.xml -Dtarget-platform=jaxrs-2020-13-no-local -Dtycho.localArtifacts=ignore -Dmaven.test.skip=true
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}